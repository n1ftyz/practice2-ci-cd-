name: Calculator CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test addition
        run: python -m unittest -v test_main.TestCalculator.test_add

      - name: Test subtraction
        run: python -m unittest -v test_main.TestCalculator.test_subtractыыыыыыыы